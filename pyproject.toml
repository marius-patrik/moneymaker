[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moneymaker"
version = "0.3.5"
description = "Provider-agnostic paper/live trading engine with pluggable strategies."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
moneymaker = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]
