name: Release

on:
  push:
    branches: [main]

# Skip the entire workflow when triggered by the bot's version-bump commit.
# The bot commit sets actor to github-actions[bot], breaking the loop.
jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write   # needed by pypa/gh-action-pypi-publish OIDC

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---- tests must be green before we touch the version ----

      - name: Install deps and run tests
        run: |
          pip install -e ".[dev]"
          pytest -v --tb=short

      # ---- bump patch version ----

      - name: Bump patch version
        id: bump
        run: |
          # Read current version
          CURRENT=$(grep '^version' pyproject.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          # Increment patch (x.y.z → x.y.z+1)
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEW="$MAJOR.$MINOR.$((PATCH + 1))"
          # Write back
          sed -i "s/^version = \"$CURRENT\"/version = \"$NEW\"/" pyproject.toml
          echo "old=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new }}"
          git push origin main

      # ---- build ----

      - name: Build package
        run: |
          pip install build
          python -m build

      # ---- tag + GitHub Release ----

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin "${{ steps.bump.outputs.tag }}"
          gh release create "${{ steps.bump.outputs.tag }}" \
            --generate-notes \
            --title "${{ steps.bump.outputs.tag }}" \
            dist/*

      # ---- GitHub Packages (PyPI-compatible registry) ----

      - name: Publish to GitHub Packages
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://upload.pkg.github.com/
          user: __token__
          password: ${{ secrets.GITHUB_TOKEN }}
          skip-existing: true
